language = "c++"
primary  = "cbuild"
compiler = "x86_64-linux-musl-gcc"
linker   = "x86_64-linux-musl-ld"

[cbuild]
type    = "executable"
sources = [
    "src/context.cpp",
    "src/main.cpp",
    "src/module.cpp",
    "src/process.cpp",
    "src/toml-ext.cpp",
]
cflags  = [
    "-ggdb",
    "-static",
    "-std=c++20",
    "-Wall",
    "-Wextra",
    "-fno-exceptions",
]
headers = [
    "hdr",
]
