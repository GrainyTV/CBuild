language = "c++"
primary  = "cbuild"
compiler = "x86_64-linux-musl-gcc"
linker   = "x86_64-linux-musl-ld"

[cbuild]
type    = "executable"
sources = ["src/main.cpp", "src/toml-ext.cpp", "src/module.cpp", "src/context.cpp"]
cflags  = ["-ggdb", "-static", "-std=c++20", "-Wall", "-Wextra"]
headers = ["hdr"]
